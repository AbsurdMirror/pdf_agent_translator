[project]
name = "pdf_agent_translator"
version = "0.1.0"
description = "CLI/GUI PDF translator: Aliyun DocMind parse + LLM translate + offline bilingual HTML"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "pdf_agent_translator contributors" }]
keywords = ["pdf", "translation", "docmind", "markdown", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "alibabacloud_docmind_api20220711>=1.3.0",
    "alibabacloud_tea_openapi>=0.3.8",
    "alibabacloud_tea_util>=0.3.11",
    "alibabacloud_credentials>=0.3.2",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pdf-translate = "pdf_agent_translator.cli:main"
pdf-translate-gui = "pdf_agent_translator.gui:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
